name: scan
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest state, not the commit this run was queued at (queued runs would repost)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow twifork==2.4.0
      - name: Scan and post
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          HCW_RELAY: https://hcw-relay.hcwdeaths14788.workers.dev/
        run: python hcw_deaths.py --post
      - name: Commit state
        if: always()  # even if the scan crashed after posting, keep the record of what was posted
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add seen_deaths.json failed_posts.json 2>/dev/null || git add seen_deaths.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push && exit 0; sleep 5; done
          exit 1
