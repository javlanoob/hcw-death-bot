name: scan
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow twifork==2.4.0
      - name: Scan and post
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python hcw_deaths.py --post
      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add seen_deaths.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
