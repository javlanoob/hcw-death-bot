name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://secure.runescape.com/m=hiscore_oldschool_hardcore_mains
          for u in "$B/index_lite.json?player=M%20Hardcorpse" "$B/overall?table=0&page=1" "$B/overall?category_type=1&table=20&page=1" "$B/ranking.json?table=0&page=1" "https://services.runescape.com/m=hiscore_oldschool_hardcore_mains/index_lite.json?player=M%20Hardcorpse" "https://secure.runescape.com/m=hiscore_oldschool/index_lite.json?player=Zezima"; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "$u")"
          done
